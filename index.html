<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MO Note">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>MO Note</title>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#EEF1F4; --ink:#1C2733; --muted:#5D6B7A; --line:#D3DAE1; --line-strong:#B5C0CB;
  --talk:#7CCB3A; --paper:#C8D12A; --idea:#3FC28A; --accent:#1C2733; --accent-ink:#FFFFFF; --warn:#9A7500;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141A21; --surface:#1C232C; --surface2:#242D38; --ink:#E4E9EF; --muted:#97A4B2; --line:#2E3945; --line-strong:#43505E;
    --accent:#E4E9EF; --accent-ink:#141A21; --warn:#E0B83A; color-scheme: dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #4A8CFF;outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:22px;width:auto;display:block}
.wordmark{font-size:19px;font-weight:800;background:linear-gradient(90deg,#7B3FE4 0%,#E0383B 35%,#F08C00 60%,#2FA84F 85%,#0BA5C4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;line-height:1}
@media (prefers-color-scheme: dark){ .wordmark{background-image:linear-gradient(90deg,#A97BFF 0%,#FF5C5F 35%,#FFB02E 60%,#4FD17A 85%,#2CD3EE 100%)} }
.offline{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:10px;padding:3px;margin:12px 0 10px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 2px;font-size:15px;white-space:nowrap;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .badge[hidden]{display:none}
.seg .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:#F08C1E;color:#fff;font-size:12px;line-height:20px}

main{flex:1;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px 12px;font-size:16px}
.f textarea{resize:vertical;line-height:1.6}
.f .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 10px}
.f .row > div{min-width:0}
/* iPhone の日付欄は既定の幅が広く、枠からはみ出すので見た目をリセットし、外枠で切る */
.datewrap{width:100%;overflow:hidden;border-radius:10px}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:46px;line-height:1.4;margin:0}
.f input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:440px){ .f .row{grid-template-columns:minmax(0,1fr)} }
.memo{min-height:200px}
.keep{font-size:12px;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.danger{color:#D2434E;border-color:#E2A4AA}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.4}
.editing{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn);margin-bottom:10px}
.editing button{margin-left:auto}

.idea-in{display:flex;gap:8px}
.idea-in textarea{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;font-size:16px;min-height:96px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:10px 2px}

.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item .t{display:block;font-weight:600;overflow-wrap:anywhere}
.item .s{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{font-size:11px;border-radius:6px;padding:1px 6px;white-space:nowrap;margin-top:3px}
.st.un{background:#F08C1E;color:#fff}
.st.sent{border:1px solid var(--line-strong);color:var(--muted)}
.item button.open{all:unset;display:contents;cursor:pointer}
.sec{font-size:13px;color:var(--muted);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.sendbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
.sendbox p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.sendbox .opts{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 0;color:var(--muted)}
.confirm{background:var(--surface);border:2px solid #F08C1E;border-radius:14px;padding:12px 14px;margin:10px 0}
.confirm p{margin:0 0 10px;font-size:14px}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
pre.preview{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px;font-size:12px;max-height:240px;overflow:auto;margin:10px 0 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
@media (min-width:700px){ header,main{max-width:680px;margin:0 auto;width:100%} }
</style>
</head>

      <button role="tab" data-v="talk" aria-selected="true">講演</button>
      <button role="tab" data-v="paper" aria-selected="false">論文</button>
      <button role="tab" data-v="idea" aria-selected="false">思い付き</button>

  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
const KEY = 'mo-note-v1', DRAFT = 'mo-note-draft-v1';
const APP_VERSION = '6';  // sw.js の VERSION と合わせる
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- データ（この端末の中だけに保存） ---------- */
let db = { items: [], last: { event:'', date:'' } };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) db = s; } catch(e){}
db.last ||= { event:'', date:'' };
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast('保存できませんでした。空き容量を確認してください'); } renderBadge(); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

let draft = {};
try { draft = JSON.parse(localStorage.getItem(DRAFT)) || {}; } catch(e){}
function saveDraft(){ try { localStorage.setItem(DRAFT, JSON.stringify(draft)); } catch(e){} }

let view = 'talk', editId = null, includeSent = false, pendingSent = null;

/* ---------- 画面切り替え ---------- */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });
function setView(v){ view = v; document.querySelectorAll('#tabs [data-v]').forEach(b => b.setAttribute('aria-selected', b.dataset.v===v)); render(); window.scrollTo(0,0); }
function render(){ ({talk:renderTalk, paper:renderPaper, idea:renderIdea, list:renderList})[view](); renderBadge(); }
function renderBadge(){ const n = db.items.filter(i => !i.sent).length; const b = $('#unsent'); b.hidden = !n; b.textContent = n; }
function updateNet(){ $('#net').hidden = navigator.onLine; }
addEventListener('online', updateNet); addEventListener('offline', updateNet); updateNet();

/* ---------- 講演 ---------- */
function speakers(){ return [...new Set(db.items.filter(i => i.kind==='talk' && i.speaker).map(i => i.speaker))]; }
function events(){ return [...new Set(db.items.filter(i => i.kind==='talk' && i.event).map(i => i.event))]; }
function renderTalk(){
  const it = editId ? db.items.find(i => i.id===editId && i.kind==='talk') : null;
  const d = it || (draft.talk ||= { speaker:'', event: db.last.event, date: db.last.date || today(), title:'', memo:'', urls:'' });
  $('#main').innerHTML = `
    ${it ? `<div class="editing">記録を編集しています<button class="btn small" id="cancelEdit">やめる</button></div>` : ''}
    <div class="card">
      <div class="f"><label for="event">研究会・学会</label><input id="event" list="evList" value="${esc(d.event)}" placeholder="例：第1回 光をねじ曲げる会" autocomplete="off"><datalist id="evList">${events().map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      <div class="f"><label for="date">日付</label><div class="datewrap"><input id="date" type="date" value="${esc(d.date)}"></div>
        ${it ? '' : '<div class="keep">研究会と日付は、次の講演にも引き継ぎます。</div>'}</div>
      <div class="f"><label for="speaker">講演者</label><input id="speaker" list="spList" value="${esc(d.speaker)}" placeholder="例：マクスウェル先生" autocomplete="off"><datalist id="spList">${speakers().map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      <div class="f"><label for="title">題目</label><input id="title" value="${esc(d.title)}" placeholder="例：負の屈折率で雨をよける傘" autocomplete="off"></div>
      <div class="f"><label for="memo">メモ</label><textarea id="memo" class="memo" placeholder="・スライド12枚目の分散関係が美しい&#10;・質疑で「それ、可視でもできますか？」">${esc(d.memo)}</textarea></div>
      <div class="f"><label for="urls">リンク（1行に1つ）</label><textarea id="urls" rows="2" placeholder="https://…" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(d.urls)}</textarea></div>
      <div class="btns">${it ? '<button class="btn danger" id="del">削除</button>' : '<button class="btn" id="clear">消す</button>'}<button class="btn primary" id="saveTalk">${it ? '更新する' : '保存する'}</button></div>
    </div>`;
  const read = () => ({ speaker: $('#speaker').value.trim(), title: $('#title').value.trim(), event: $('#event').value.trim(), date: $('#date').value, memo: $('#memo').value.replace(/\s+$/,''), urls: $('#urls').value.trim() });
  if (!it) $('#main .card').addEventListener('input', () => { draft.talk = read(); saveDraft(); });
  $('#saveTalk').onclick = () => {
    const v = read();
    if (!v.speaker && !v.title && !v.memo){ toast('講演者・題目・メモのどれかを書いてください'); return; }
    if (it){ Object.assign(it, v, { updated: new Date().toISOString(), sent: false }); editId = null; save(); toast('更新しました（未送信に戻りました）'); setView('list'); return; }
    db.items.push({ id: uid(), kind:'talk', ...v, created: new Date().toISOString(), sent: false });
    db.last = { event: v.event, date: v.date };
    draft.talk = { speaker:'', event: v.event, date: v.date, title:'', memo:'', urls:'' }; saveDraft(); save();
    toast('保存しました'); renderTalk(); window.scrollTo(0,0);
  };
  if ($('#clear')) $('#clear').onclick = () => { if (!confirm('書きかけの内容を消しますか？')) return; draft.talk = { speaker:'', event: db.last.event, date: db.last.date || today(), title:'', memo:'', urls:'' }; saveDraft(); renderTalk(); };
  if ($('#del')) $('#del').onclick = () => removeItem(it);
  if ($('#cancelEdit')) $('#cancelEdit').onclick = () => { editId = null; setView('list'); };
}

/* ---------- 論文 ---------- */
function urlShort(url){
  try { const u = new URL(url); const h = u.hostname.replace(/^www\./,'');
    if (h==='doi.org' || h==='dx.doi.org') return 'DOI ' + decodeURIComponent(u.pathname.slice(1));
    const ax = url.match(/arxiv\.org\/(?:abs|pdf)\/([\w.\-\/]+?)(?:v\d+)?(?:\.pdf)?$/i); if (ax) return 'arXiv ' + ax[1];
    const tail = u.pathname.split('/').filter(Boolean).slice(-1)[0] || '';
    return h + (tail ? ' / ' + decodeURIComponent(tail).slice(0,40) : '');
  } catch(e){ return url; }
}
function cleanUrl(v){
  v = String(v||'').trim(); const m = v.match(/https?:\/\/\S+/); if (m) return m[0];
  if (/^10\.\d{4,}\/\S+$/.test(v)) return 'https://doi.org/' + v;
  if (/^(arxiv:)?\d{4}\.\d{4,5}(v\d+)?$/i.test(v)) return 'https://arxiv.org/abs/' + v.replace(/^arxiv:/i,'');
  return v;
}
function renderPaper(){
  const it = editId ? db.items.find(i => i.id===editId && i.kind==='paper') : null;
  const d = it || (draft.paper ||= { url:'', comment:'' });
  const recent = db.items.filter(i => i.kind==='paper').slice(-5).reverse();
  $('#main').innerHTML = `
    ${it ? `<div class="editing">記録を編集しています<button class="btn small" id="cancelEdit">やめる</button></div>` : ''}
    <div class="card">
      <div class="f"><label for="purl">論文のURL（DOI・arXiv番号でも可）</label>
        <div style="display:flex;gap:8px"><input id="purl" type="url" inputmode="url" value="${esc(d.url)}" placeholder="https://doi.org/…" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1"><button class="btn small" id="paste" type="button">貼り付け</button></div>
        <div class="keep" id="purlHint">${d.url ? esc(urlShort(cleanUrl(d.url))) : 'Safari などで論文を開いて、共有 →「コピー」したURLを貼り付けてください。'}</div></div>
      <div class="f"><label for="pcomment">コメント</label><textarea id="pcomment" rows="5" placeholder="なぜ気になったか、どこが使えそうか">${esc(d.comment)}</textarea></div>
      <div class="btns">${it ? '<button class="btn danger" id="del">削除</button>' : ''}<button class="btn primary" id="savePaper">${it ? '更新する' : '保存する'}</button></div>
    </div>
    ${!it && recent.length ? `<div class="sec">最近の論文</div><ul class="list">${recent.map(itemHtml).join('')}</ul>` : ''}
    ${!it && !recent.length ? '<p class="hint">ここではURLとコメントだけ残します。タイトルや著者、プロジェクトとのつながりは、MO Spectrum（ノートPC）で整理してください。</p>' : ''}`;
  const read = () => ({ url: $('#purl').value.trim(), comment: $('#pcomment').value.replace(/\s+$/,'') });
  $('#main .card').addEventListener('input', () => { $('#purlHint').textContent = $('#purl').value.trim() ? urlShort(cleanUrl($('#purl').value)) : ''; if (!it){ draft.paper = read(); saveDraft(); } });
  $('#paste').onclick = async () => { try { const t = await navigator.clipboard.readText(); if (!t) return; $('#purl').value = cleanUrl(t); $('#purl').dispatchEvent(new Event('input', {bubbles:true})); } catch(e){ toast('貼り付けできませんでした。欄を長押しして「ペースト」してください'); } };
  $('#savePaper').onclick = () => {
    const v = read(); v.url = cleanUrl(v.url);
    if (!v.url && !v.comment){ toast('URLかコメントを書いてください'); return; }
    const dup = !it && v.url && db.items.find(i => i.kind==='paper' && i.url===v.url);
    if (dup && !confirm('このURLはすでに記録しています。もう一度記録しますか？')) return;
    if (it){ Object.assign(it, v, { updated: new Date().toISOString(), sent: false }); editId = null; save(); toast('更新しました（未送信に戻りました）'); setView('list'); return; }
    db.items.push({ id: uid(), kind:'paper', ...v, created: new Date().toISOString(), sent: false });
    draft.paper = { url:'', comment:'' }; saveDraft(); save(); toast('保存しました'); renderPaper();
  };
  if ($('#del')) $('#del').onclick = () => removeItem(it);
  if ($('#cancelEdit')) $('#cancelEdit').onclick = () => { editId = null; setView('list'); };
  $('#main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
}

/* ---------- 思い付き ---------- */
function renderIdea(){
  const it = editId ? db.items.find(i => i.id===editId && i.kind==='idea') : null;
  const recent = db.items.filter(i => i.kind==='idea').slice(-5).reverse();
  $('#main').innerHTML = `
    ${it ? `<div class="editing">記録を編集しています<button class="btn small" id="cancelEdit">やめる</button></div>` : ''}
    <div class="idea-in"><textarea id="ideaText" placeholder="思い付いたことを書いて保存">${esc(it ? it.text : (draft.idea || ''))}</textarea></div>
    <div class="btns" style="margin-top:10px">${it ? '<button class="btn danger" id="del">削除</button>' : ''}<button class="btn primary" id="saveIdea">${it ? '更新する' : '保存する'}</button></div>
    ${!it && recent.length ? `<div class="sec">最近の思い付き</div><ul class="list">${recent.map(itemHtml).join('')}</ul>` : ''}
    ${!it && !recent.length ? '<p class="hint">1行でも、数行でもかまいません。保存した思い付きは、MO Spectrum の登録タブ（整理待ち）に入ります。</p>' : ''}`;
  const ta = $('#ideaText');
  if (!it){ ta.addEventListener('input', () => { draft.idea = ta.value; saveDraft(); }); }
  $('#saveIdea').onclick = () => {
    const text = ta.value.trim(); if (!text){ toast('内容を書いてください'); return; }
    if (it){ it.text = text; it.updated = new Date().toISOString(); it.sent = false; editId = null; save(); toast('更新しました（未送信に戻りました）'); setView('list'); return; }
    db.items.push({ id: uid(), kind:'idea', text, created: new Date().toISOString(), sent: false });
    draft.idea = ''; saveDraft(); save(); toast('保存しました'); renderIdea();
  };
  if ($('#del')) $('#del').onclick = () => removeItem(it);
  if ($('#cancelEdit')) $('#cancelEdit').onclick = () => { editId = null; setView('list'); };
  $('#main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
}

/* ---------- 記録と送信 ---------- */
function itemHtml(i){
  const K = { talk:['講演','var(--talk)'], paper:['論文','var(--paper)'], idea:['思い付き','var(--idea)'] }[i.kind];
  const t = i.kind==='talk' ? (i.title || '（題目なし）') : i.kind==='paper' ? (i.url ? urlShort(i.url) : '（URLなし）') : i.text.split('\n')[0];
  const sub = i.kind==='talk' ? [i.speaker, i.event, i.date].filter(Boolean).join('・') : i.kind==='paper' ? ((i.comment||'').split('\n')[0] || (i.created||'').slice(0,10)) : (i.created||'').slice(0,10);
  return `<li class="item"><span class="dot" style="background:${K[1]}"></span><button class="open" data-edit="${i.id}"><span class="tx"><span class="t">${esc(t)}</span><span class="s">${esc(K[0] + '　')}${esc(sub)}</span></span></button><span class="st ${i.sent?'sent':'un'}">${i.sent?'送信済み':'未送信'}</span></li>`;
}
function openEdit(id){ const it = db.items.find(i => i.id===id); if (!it) return; editId = id; setView(it.kind); }
function removeItem(it){ if (!confirm('この記録を削除しますか？')) return; db.items = db.items.filter(i => i !== it); editId = null; save(); toast('削除しました'); setView('list'); }

/* MO Spectrum の「取り込む」欄がそのまま読める形式 */
function buildExport(items){
  const out = [`MO Note から書き出し（${today()}）`, ''];
  items.filter(i => i.kind==='talk').forEach(i => {
    out.push(`# 講演：${i.speaker || '講演者未入力'}`);
    if (i.event) out.push(`研究会：${i.event}`);
    if (i.date) out.push(`日付：${i.date}`);
    if (i.title) out.push(`題目：${i.title}`);
    (i.urls||'').split('\n').map(u => u.trim()).filter(Boolean).forEach(u => out.push(`URL：${u}`));
    (i.memo||'').split('\n').forEach(l => out.push(/^\s*#/.test(l) || /^(研究会|学会|会議|日付|日時|題目|タイトル|演題|講演者|発表者|URL|リンク)\s*[:：]/.test(l.trim()) ? '　' + l : l));
    out.push('');
  });
  const papers = items.filter(i => i.kind==='paper');
  if (papers.length){
    out.push('## 論文');
    papers.forEach(i => { out.push(`URL：${i.url || '（URLなし）'}`); (i.comment||'').split('\n').forEach(l => out.push(/^\s*#/.test(l) || /^(URL|リンク|DOI)\s*[:：]/i.test(l.trim()) || /^(https?:\/\/\S+|10\.\d{4,}\/\S+)\s*$/.test(l.trim()) ? '　' + l : l)); out.push(''); });
  }
  const ideas = items.filter(i => i.kind==='idea');
  if (ideas.length){ out.push('## 思い付き'); ideas.forEach(i => out.push('- ' + i.text.replace(/\n+/g, ' ／ '))); out.push(''); }
  return out.join('\n');
}
function renderList(){
  const un = db.items.filter(i => !i.sent).slice().reverse();
  const sent = db.items.filter(i => i.sent).slice().reverse();
  const target = includeSent ? db.items : db.items.filter(i => !i.sent);
  $('#main').innerHTML = `
    <div class="sendbox">
      <p>講演・論文・思い付きの記録を MO Spectrum（ノートPC）に送ります。共有メニューから、自分宛てのメールや OneDrive などを選んでください。</p>
      <div class="btns"><button class="btn primary" id="send" ${target.length?'':'disabled'}>MO Spectrumへ送る（${target.length}件）</button><button class="btn" id="copy" ${target.length?'':'disabled'}>コピー</button></div>
      <label class="opts"><input type="checkbox" id="incSent" ${includeSent?'checked':''}> 送信済みの記録も含める</label>
    </div>
    ${pendingSent ? `<div class="confirm"><p>送れましたか？ 送れていれば、${pendingSent.length}件を「送信済み」にします。</p><div class="btns"><button class="btn" id="notYet">まだ</button><button class="btn primary" id="markSent">送信済みにする</button></div></div>` : ''}
    ${!db.items.length ? '<div class="empty">まだ記録はありません。<br>「講演」「論文」「思い付き」から書いてください。</div>' : ''}
    ${un.length ? `<div class="sec">未送信 ${un.length}件</div><ul class="list">${un.map(itemHtml).join('')}</ul>` : ''}
    ${sent.length ? `<div class="sec">送信済み ${sent.length}件</div><ul class="list">${sent.map(itemHtml).join('')}</ul>
      <button class="btn small" id="clean" style="margin-top:6px">送信済みの記録を削除する</button>` : ''}
    <p class="hint" style="text-align:center;margin-top:24px">MO Note バージョン ${APP_VERSION}</p>`;
  $('#incSent').onchange = e => { includeSent = e.target.checked; renderList(); };
  $('#main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
  $('#send').onclick = () => share(target);
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(buildExport(target)); pendingSent = target.map(i => i.id); toast('コピーしました'); renderList(); } catch(e){ toast('コピーできませんでした'); } };
  if ($('#markSent')) $('#markSent').onclick = () => { const ids = new Set(pendingSent); db.items.forEach(i => { if (ids.has(i.id)) i.sent = true; }); pendingSent = null; save(); toast('送信済みにしました'); renderList(); };
  if ($('#notYet')) $('#notYet').onclick = () => { pendingSent = null; renderList(); };
  if ($('#clean')) $('#clean').onclick = () => { if (!confirm(`送信済みの記録 ${sent.length}件をこのiPhoneから削除します。MO Spectrum に取り込み済みか確認してから実行してください。`)) return; db.items = db.items.filter(i => !i.sent); save(); toast('削除しました'); renderList(); };
}
async function share(items){
  const text = buildExport(items);
  const name = `mo-note-${today()}.txt`;
  try {
    const file = new File([text], name, { type:'text/plain' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file], title: name });
    else if (navigator.share) await navigator.share({ title: name, text });
    else { await navigator.clipboard.writeText(text); toast('共有できない環境なので、コピーしました'); }
    pendingSent = items.map(i => i.id); renderList();
  } catch(e){
    if (e && e.name === 'AbortError') return;
    try { await navigator.clipboard.writeText(text); pendingSent = items.map(i => i.id); toast('共有できなかったので、コピーしました'); renderList(); } catch(_){ toast('送れませんでした'); }
  }
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
</script>
